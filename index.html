<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몽당연필의 줌과외 1기 종목추천</title>
<style>
  :root{
    --bg:#F7F8FA;
    --panel:#FFFFFF;
    --panel-2:#F1F3F6;
    --line:#E3E6EB;
    --text:#1A1D21;
    --sub:#6B7280;
    --kospi:#D93025;
    --kospi200:#E07B1E;
    --kosdaq:#1A73E8;
    --kosdaq150:#0F9D78;
    --cap-large:#B8860B;
    --cap-mid:#0F9D78;
    --cap-small:#8A93A1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    line-height:1.5; padding:0 0 60px;
  }
  #gate{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    z-index:100; flex-direction:column; gap:16px; padding:24px;
  }
  #gate h2{font-size:22px; font-weight:600;}
  #gate p{color:var(--sub); font-size:16px; text-align:center; max-width:300px;}
  #gate input{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:12px 14px; border-radius:8px; font-size:18px; width:240px; text-align:center;
  }
  #gate button{
    background:var(--kospi); color:#fff; border:none; padding:12px 24px;
    border-radius:8px; font-size:18px; font-weight:600; cursor:pointer; width:240px;
  }
  #gate .err{color:var(--kospi); font-size:16px; display:none;}

  #app{display:none; max-width:1181px; margin:0 auto; padding:24px 18px;}
  header{margin-bottom:16px;}
  header h1{font-size:26px; font-weight:700; letter-spacing:-0.3px;}
  header .sub{color:var(--sub); font-size:16px; margin-top:6px;}

  .period-bar{
    display:flex; align-items:center; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:20px;
    flex-wrap:wrap;
  }
  .period-bar label{font-size:13px; color:var(--sub);}
  .period-bar input[type=date]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:7px 8px; border-radius:6px; font-size:16px;
  }
  .period-bar .sep{color:var(--sub); font-size:14px;}
  .quick-range{display:flex; gap:6px; margin-left:6px;}
  .quick-range button{
    background:var(--panel-2); color:var(--sub); border:1px solid var(--line);
    padding:6px 10px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;
  }
  .quick-range button.active{background:var(--kospi); color:#fff; border-color:var(--kospi);}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 12px;}
  .stat-card .num{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3;}
  .stat-card .label{color:var(--sub); font-size:14px; margin-top:4px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:0;}
  .two-col .panel{margin-bottom:16px;}
  @media (max-width:700px){ .two-col{grid-template-columns:1fr;} }
  .panel h3{font-size:17px; font-weight:600; margin-bottom:14px; color:var(--text);}
  .panel h3 .hint{color:var(--sub); font-size:13px; font-weight:400; margin-left:6px;}

  .scroll-box{padding-right:0;}

  .bar-group{margin-bottom:6px;}
  .bar-row{display:flex; flex-direction:column; gap:6px; font-size:16px; padding:8px 4px; border-radius:6px; cursor:pointer;}
  .bar-row:hover{background:var(--panel-2);}
  .bar-row-top{display:flex; align-items:center; gap:8px;}
  .bar-row-bottom{display:flex; align-items:center; gap:10px;}
  .bar-row .chev{color:var(--sub); font-size:10px; width:10px; transition:transform 0.15s;}
  .bar-row.open .chev{transform:rotate(90deg);}
  .bar-label{color:var(--text); font-size:15px; font-weight:600; white-space:nowrap;}
  .bar-track{flex:1; background:var(--panel-2); border-radius:5px; height:22px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px;}
  .bar-count{flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums; color:var(--sub); font-size:14px; min-width:96px;}

  .sub-list{display:none; padding:4px 4px 10px 18px;}
  .sub-list.show{display:block;}
  .sub-item{display:flex; justify-content:space-between; align-items:center; font-size:15px; padding:6px 0; border-bottom:1px solid var(--line); gap:8px;}
  .sub-item:last-child{border-bottom:none;}
  .sub-item .n{color:var(--sub); margin-right:6px;}
  .sub-item .c{color:var(--sub); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .sub-item .name-cell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;}
  .sub-item .name-cell:hover{color:var(--kosdaq);}

  .table-wrap{max-height:690px; overflow-y:auto; overflow-x:auto; margin:0 -18px; padding:0 18px;}
  .table-wrap::-webkit-scrollbar{width:6px; height:6px;}
  .table-wrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  table{width:100%; table-layout:fixed; border-collapse:collapse; font-size:14px; min-width:760px;}
  th{
    text-align:right; color:var(--sub); font-weight:500; font-size:13px; padding:0 6px 10px;
    border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    position:sticky; top:0; background:var(--panel); cursor:default;
  }
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--text);}
  th .arrow{font-size:10px; margin-left:2px; opacity:0.6;}
  /* 컬럼 폭: 순위(신규, 최소) · 업종(전체가 보이도록 확대) · 시장/현재가/시총 유지 · 종목 유지 · 남는 폭은 1~50일 6칸에 균등 배분 */
  th:nth-child(1), td:nth-child(1){text-align:center; width:3%;}
  th:nth-child(2), td:nth-child(2){text-align:center; width:9%;}
  th:nth-child(3), td:nth-child(3){text-align:center; width:12%;}
  th:nth-child(4){text-align:center; width:14%;}
  td:nth-child(4){text-align:left; width:14%; white-space:normal; word-break:keep-all;}
  th:nth-child(5), td:nth-child(5){text-align:center; font-size:13px; width:12%;}
  th:nth-child(6), td:nth-child(6){text-align:center; font-size:13px; width:10%;}
  th:nth-child(7), td:nth-child(7), th:nth-child(8), td:nth-child(8), th:nth-child(9), td:nth-child(9),
  th:nth-child(10), td:nth-child(10), th:nth-child(11), td:nth-child(11), th:nth-child(12), td:nth-child(12){text-align:center; width:6.67%;}
  td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  tr:last-child td{border-bottom:none;}
  .rank-cell{color:var(--sub); font-variant-numeric:tabular-nums; font-weight:600;}
  .sector-cell{color:var(--sub); font-size:12px; white-space:nowrap; overflow:visible;}
  .stock-cell{font-weight:600; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; white-space:normal; font-size:13px; word-break:keep-all;}
  .stock-cell:hover{color:var(--kosdaq);}
  .stock-code{display:inline; color:var(--sub); font-size:11px; font-weight:400; margin-left:6px;}

  .tag{display:inline-block; font-size:12px; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap;}
  .tag.kospi{background:rgba(217,48,37,0.1); color:var(--kospi);}
  .tag.kospi200{background:rgba(224,123,30,0.12); color:var(--kospi200);}
  .tag.kosdaq{background:rgba(26,115,232,0.1); color:var(--kosdaq);}
  .tag.kosdaq150{background:rgba(15,157,120,0.12); color:var(--kosdaq150);}

  #kospi-chart-info, #kosdaq-chart-info{font-size:19.5px; font-weight:700; color:var(--text);}

  .chart-legend span{display:inline-flex; align-items:center; gap:4px;}
  .chart-legend i{display:inline-block; width:14px; height:0; border-top-width:2px; border-top-style:solid;}

  .note{color:var(--sub); font-size:13px; margin-top:10px; line-height:1.5;}
  footer{color:var(--sub); font-size:13px; text-align:center; margin-top:8px;}
</style>
</head>

<div id="gate">
  <h2>몽당연필의 줌과외 1기 종목추천</h2>
  <p>비밀번호를 입력하세요<br><span style="color:var(--kospi)">(실제 배포 시 서버 단 인증으로 대체)</span></p>
  <input type="password" id="pw" placeholder="비밀번호">

</div>

<div id="app">

    <div class="sub" id="update-line"></div>
    <div class="sub" id="summary-line"></div>
  </header>

  <div class="period-bar">
    <label>기간</label>
    <input type="date" id="start-date">
    <span class="sep">~</span>

      <button data-n="50" onclick="setQuickRange(50,this)">50영업일</button>

  </div>

  <div class="two-col">
    <div class="panel">

      <div id="kospi-chart"></div>
    </div>
    <div class="panel">
      <h3>KOSDAQ <span class="hint" id="kosdaq-chart-info"></span></h3>
      <div id="kosdaq-chart"></div>
    </div>

  <div class="stat-row">

  <div class="two-col">
    <div class="panel">
      <h3>시장 분포 <span class="hint">클릭하면 종목이 펼쳐집니다</span></h3>
      <div class="scroll-box" id="market-bars"></div>
    </div>

    <div class="panel">
      <h3>시가총액 분포</h3>
      <div class="scroll-box" id="cap-bars"></div>
    </div>
  </div>

  <div class="panel">
    <h3>추천 순위 <span class="hint">종목명 클릭 시 네이버 종목방 팝업 · 헤더 클릭 시 정렬</span></h3>
    <div class="table-wrap">
    <table>
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="rank-table"></tbody>
    </table>
    </div>
  </div>

  <footer>KRX·DART 데이터 기준 · 매일 수동 업데이트 · 시총/현재가/코스피200·코스닥150 여부는 예시 데이터</footer>
</div>

let chartWindow = 5;

function computeMA(closes, period){
  const out = new Array(closes.length).fill(null);
  let sum = 0;
  for(let i=0;i<closes.length;i++){
    sum += closes[i];
    if(i >= period) sum -= closes[i-period];
    if(i >= period-1) out[i] = sum/period;
  }
  return out;
}

// 이동평균선 7개: [기간, 색상, 선굵기]
const MA_LINES = [
  [5,   '#E5484D', 1.0],
  [20,  '#1A73E8', 1.8],
  [100, '#0F9D78', 2.4],
  [200, '#111111', 3.0],
];

function renderCandleChart(containerId, infoId, rows, windowN){
  const closesAll = rows.map(r=>r[4]);
  const maAllByPeriod = {};
  MA_LINES.forEach(([p]) => { maAllByPeriod[p] = computeMA(closesAll, p); });

  // 표시 구간은 항상 최근 1년(고정 244거래일)로 자르되, 이동평균선은 그 이전 데이터(연결한 전년도 데이터)까지 활용해 처음부터 끊김없이 채운다.
  const n = Math.min(windowN, rows.length);
  const start = rows.length - n;
  const vis = rows.slice(start);
  const maVis = {};
  MA_LINES.forEach(([p]) => { maVis[p] = maAllByPeriod[p].slice(start); });

  const W = 600, H = 260, padL = 44, padR = 10, padT = 14, padB = 20;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  let lo = Infinity, hi = -Infinity;
  vis.forEach(r => { lo = Math.min(lo, r[3]); hi = Math.max(hi, r[2]); });
  MA_LINES.forEach(([p]) => { maVis[p].forEach(v => { if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }); });
  const pad = (hi-lo)*0.06 || 1;
  lo -= pad; hi += pad;

  const yOf = v => padT + (hi - v) / (hi - lo) * plotH;
  const cw = plotW / n;
  const xOf = i => padL + i*cw + cw/2;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // y축 그리드 + 라벨 (상/중/하)
  [hi-pad, (hi+lo)/2, lo+pad].forEach(v => {
    const y = yOf(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    svg += `<text x="2" y="${y+3}" font-size="9" fill="var(--sub)">${v.toFixed(1)}</text>`;
  });

  // 5일선-20일선 사이 채우기: 5일선이 20일선 위면 연한 핑크, 아래면 회색
  {
    const m5 = maVis[5], m20 = maVis[20];
    let segStart = null, segSign = null;
    const flushSeg = (endIdx) => {
      if(segStart == null || endIdx <= segStart) return;
      let d = `M ${xOf(segStart)} ${yOf(m5[segStart])} `;
      for(let i=segStart+1;i<=endIdx;i++) d += `L ${xOf(i)} ${yOf(m5[i])} `;
      for(let i=endIdx;i>=segStart;i--) d += `L ${xOf(i)} ${yOf(m20[i])} `;
      d += 'Z';
      const fillColor = segSign ? 'rgba(244,143,177,0.30)' : 'rgba(154,161,171,0.30)';
      svg += `<path d="${d}" fill="${fillColor}" stroke="none"/>`;
    };
    for(let i=0;i<vis.length;i++){
      if(m5[i]==null || m20[i]==null){ flushSeg(i-1); segStart=null; segSign=null; continue; }
      const sign = m5[i] >= m20[i];
      if(segStart==null){ segStart=i; segSign=sign; }
      else if(sign !== segSign){ flushSeg(i); segStart=i; segSign=sign; }
    }
    flushSeg(vis.length-1);
  }

  // 캔들 (양봉: 꽉 찬 붉은색 / 음봉: 속이 빈 파란색)
  vis.forEach((r,i) => {
    const [d,o,h,l,c] = r;
    const up = c >= o;
    const color = up ? 'var(--kospi)' : 'var(--kosdaq)';
    const fillAttr = up ? color : 'none';
    const x = xOf(i);
    const yO = yOf(o), yC = yOf(c), yH = yOf(h), yL = yOf(l);
    const bodyTop = Math.min(yO,yC), bodyH = Math.max(Math.abs(yC-yO), 1);
    svg += `<line x1="${x}" y1="${yH}" x2="${x}" y2="${yL}" stroke="${color}" stroke-width="1"/>`;
    svg += `<rect x="${x-cw*0.32}" y="${bodyTop}" width="${cw*0.64}" height="${bodyH}" fill="${fillAttr}" stroke="${color}" stroke-width="1"/>`;
  });

  function maPath(arr, strokeWidth, color){
    let d = ''; let started = false;
    arr.forEach((v,i) => {
      if(v == null){ started = false; return; }
      const x = xOf(i), y = yOf(v);
      d += (started ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      started = true;
    });
    if(d) svg += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${strokeWidth}"/>`;
  }
  MA_LINES.forEach(([p,color,width]) => maPath(maVis[p], width, color));

  svg += '</svg>';
  const legend = MA_LINES.map(([p,color,width]) =>
    `<span><i style="border-color:${color}; border-top-width:${Math.max(width,1)}px"></i>${p}일선</span>`
  ).join('');
  document.getElementById(containerId).innerHTML = svg + '<div class="chart-legend">' + legend + '</div>';

  const last = vis[vis.length-1];
  const prevClose = vis.length>1 ? vis[vis.length-2][4] : last[1];
  const chg = last[4]-prevClose, pct = prevClose ? (chg/prevClose*100) : 0;
  const sign = chg>=0 ? '+' : '';
  document.getElementById(infoId).textContent =
    `${last[4].toLocaleString()} (${sign}${chg.toFixed(2)}, ${sign}${pct.toFixed(2)}%)`;
}

function renderCharts(windowN){
  chartWindow = windowN;
  renderCandleChart('kospi-chart', 'kospi-chart-info', CHART_DATA.KOSPI, windowN);
  renderCandleChart('kosdaq-chart', 'kosdaq-chart-info', CHART_DATA.KOSDAQ, windowN);
}


function checkPw(){
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('update-line').textContent = '업데이트 시간 : ' + UPDATED_AT;
    buildTableHead();
    initDates();
    setQuickRangeSilent(5);
    renderCharts(244); // 코스피/코스닥 차트는 항상 최근 1년(244거래일)만 표시 - 이전 데이터는 이동평균선 계산에만 사용
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') checkPw(); });

// ---- 영업일(주말 제외) 계산 ----
function isWeekend(d){ const day = d.getDay(); return day===0 || day===6; }
function bizDaysStart(endDateStr, n){
  let d = new Date(endDateStr);
  let count = 1;
  while(count < n){
    d.setDate(d.getDate()-1);
    if(!isWeekend(d)) count++;
  }
  return d.toISOString().slice(0,10);
}

function initDates(){
  const dates = DATA.picks.map(p=>p.date).sort();
  latestDate = dates[dates.length-1];
  document.getElementById('start-date').addEventListener('change', applyRange);
  document.getElementById('end-date').addEventListener('change', applyRange);
}

function setQuickRangeSilent(n){
  const btn = document.querySelector('.quick-range button[data-n="'+n+'"]');
  document.querySelectorAll('.quick-range button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('start-date').value = bizDaysStart(latestDate, n);
  document.getElementById('end-date').value = latestDate;
  applyRange();
}

function setQuickRange(n, btn){
  document.querySelectorAll('.quick-range button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('start-date').value = bizDaysStart(document.getElementById('end-date').value || latestDate, n);
  applyRange();
}

function applyRange(){
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  currentPicks = DATA.picks.filter(p => p.date >= start && p.date <= end);
  render(end);
}

function fmtCap(v){
  if(v >= 10000) return (v/10000).toFixed(1).replace(/\.0$/,'') + '조';
  return v.toLocaleString() + '억';
}
function fmtPrice(v){ return v.toLocaleString() + '원'; }

function marketLabel(s){
  if(s.market === 'KOSPI') return s.inIndex ? 'KOSPI200' : 'KOSPI';
  return s.inIndex ? 'KOSDAQ150' : 'KOSDAQ';
}
function marketTagClass(s){
  if(s.market === 'KOSPI') return s.inIndex ? 'kospi200' : 'kospi';
  return s.inIndex ? 'kosdaq150' : 'kosdaq';
}
function marketTagHtml(s, mini){
  const cls = marketTagClass(s);
  return `<span class="tag ${mini?'mini':''} ${cls}">${marketLabel(s)}</span>`;
}
function openNaver(code){
  window.open('https://stock.naver.com/domestic/stock/'+code+'/total', 'naverStock', 'width=1000,height=800,noopener');
}

function buildBarGroup(label, count, total, color, subHtml){
  const group = document.createElement('div');
  group.className = 'bar-group';
  const pct = total ? Math.round((count/total)*100) : 0;
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.innerHTML = `
    <div class="bar-row-top">
      <span class="chev">▶</span>
      <div class="bar-label">${label}</div>
    </div>
    <div class="bar-row-bottom">
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color}"></div></div>
      <div class="bar-count">${count}건 · ${pct}%</div>
    </div>
  `;
  const subList = document.createElement('div');
  subList.className = 'sub-list';
  subList.innerHTML = subHtml;
  row.addEventListener('click', () => {
    row.classList.toggle('open');
    subList.classList.toggle('show');
  });
  group.appendChild(row);
  group.appendChild(subList);
  return group;
}

function buildTableHead(){
  const tr = document.getElementById('table-head');
  tr.innerHTML = COLUMNS.map(c => {
    if(!c.sortable) return `<th>${c.label}</th>`;
    const arrow = sortState.field === c.field ? (sortState.dir==='desc' ? '▼' : '▲') : '';
    return `<th class="sortable" data-field="${c.field}">${c.label}<span class="arrow">${arrow}</span></th>`;
  }).join('');
  tr.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const f = th.dataset.field;
      if(sortState.field === f){ sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc'; }
      else { sortState = { field:f, dir:'desc' }; }
      buildTableHead();
      renderTable();
    });
  });
}

function renderTable(){
  const tbody = document.getElementById('rank-table');
  tbody.innerHTML = '';
  const isWindowField = f => ['w1','w3','w5','w10','w20','w50'].includes(f);
  const isTextField = f => ['sector','market','name'].includes(f);
  const getVal = (s,f) => {
    if(isWindowField(f)) return s.counts[f];
    if(f === 'market') return marketLabel(s);
    return s[f];
  };
  const sorted = [...rankedAll].sort((a,b) => {
    let va = getVal(a, sortState.field), vb = getVal(b, sortState.field);
    if(va == null && vb == null) return 0;
    if(va == null) return 1;
    if(vb == null) return -1;
    if(isTextField(sortState.field)){
      return sortState.dir === 'desc' ? String(vb).localeCompare(String(va),'ko') : String(va).localeCompare(String(vb),'ko');
    }
    return sortState.dir === 'desc' ? vb - va : va - vb;
  });
  sorted.forEach((s, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rank-cell">${idx+1}</td>
      <td class="sector-cell">${s.sector}</td>
      <td>${marketTagHtml(s)}</td>
      <td><span class="stock-cell" onclick="openNaver('${s.code}')">${s.name}</span></td>
      <td>${fmtPrice(s.price)}</td>
      <td>${fmtCap(s.marketCap)}</td>
      <td>${s.counts.w1}</td>
      <td>${s.counts.w3}</td>
      <td>${s.counts.w5}</td>
      <td>${s.counts.w10}</td>
      <td>${s.counts.w20}</td>
      <td>${s.counts.w50}</td>
    `;
    tbody.appendChild(tr);
  });
}

function render(anchorDate){
  const byStock = {};
  currentPicks.forEach(p => {
    const key = p.code;
    if(!byStock[key]) byStock[key] = { name:p.name, code:p.code, market:p.market, inIndex:p.inIndex, sector:p.sector, marketCap:p.marketCap, price:p.price, count:0 };
    byStock[key].count++;
    byStock[key].marketCap = p.marketCap;
    byStock[key].price = p.price;
  });
  const ranked = Object.values(byStock).sort((a,b)=>b.count-a.count);

  document.getElementById('stat-total-picks').textContent = currentPicks.length;
  document.getElementById('stat-unique').textContent = ranked.length;

  // 최다 추천 종목 - 동률이면 전부 표시
  const topCount = ranked.length ? ranked[0].count : 0;
  const topNames = ranked.filter(s => s.count === topCount).map(s => s.name);
  const topEl = document.getElementById('stat-top');
  if(topNames.length){
    topEl.style.fontSize = topNames.length > 1 ? '15px' : '22px';
    topEl.textContent = topNames.join(', ');
  } else {
    topEl.style.fontSize = '22px';
    topEl.textContent = '-';
  }

  document.getElementById('summary-line').textContent =
    `${document.getElementById('start-date').value} ~ ${document.getElementById('end-date').value} · 추천 ${currentPicks.length}건 · 종목 ${ranked.length}개`;

  // ---- 시장 분포: KOSPI200 → KOSPI(제외) → KOSDAQ150 → KOSDAQ(제외) ----
  const groupDefs = [
    { label:'KOSPI200', color:'var(--kospi200)', filter: s => s.market==='KOSPI' && s.inIndex },
    { label:'KOSPI (KOSPI200 제외)', color:'var(--kospi)', filter: s => s.market==='KOSPI' && !s.inIndex },
    { label:'KOSDAQ150', color:'var(--kosdaq150)', filter: s => s.market==='KOSDAQ' && s.inIndex },
    { label:'KOSDAQ (KOSDAQ150 제외)', color:'var(--kosdaq)', filter: s => s.market==='KOSDAQ' && !s.inIndex },
  ];
  const marketBars = document.getElementById('market-bars');
  marketBars.innerHTML = '';
  const groupCounts = groupDefs.map(g => ranked.filter(g.filter).reduce((s,x)=>s+x.count,0));
  const maxGroupCount = Math.max(...groupCounts, 1); // 가장 긴 막대가 끝까지 채워지도록 최대값 기준
  groupDefs.forEach((g, gi) => {
    const stocks = ranked.filter(g.filter);
    const count = groupCounts[gi];
    marketBars.appendChild(buildBarGroup(g.label, count, maxGroupCount, g.color,
      stocks.map((s,i)=>`<div class="sub-item"><span class="name-cell" onclick="openNaver('${s.code}')"><span class="n">${i+1}.</span>${s.name}</span><span class="c">${s.count}회</span></div>`).join('') || '<div class="sub-item">해당 없음</div>'
    ));
  });

  // ---- 시가총액 분포 (7단계, 종목 앞에 시장구분 배지) ----
  const capTiers = [
    { label:'10조 이상',   min:100000,  color:'#B8860B' },
    { label:'10조~1조',    min:10000,   color:'#D4A24E' },
    { label:'1조~5000억',  min:5000,    color:'#3FB28F' },
    { label:'5000억 이하', min:-Infinity, color:'#8A93A1' },
  ];
  const capBuckets = {}; const capColor = {};
  capTiers.forEach(t => { capBuckets[t.label] = []; capColor[t.label] = t.color; });
  ranked.forEach(s => {
    const tier = capTiers.find(t => s.marketCap >= t.min);
    capBuckets[tier.label].push(s);
  });
  const capBars = document.getElementById('cap-bars');
  capBars.innerHTML = '';
  const capCounts = capTiers.map(t => capBuckets[t.label].length);
  const maxCapCount = Math.max(...capCounts, 1); // 시장분포와 동일하게, 가장 긴 막대가 끝까지 채워지도록 최대값 기준
  Object.entries(capBuckets).forEach(([label, stocks]) => {
    capBars.appendChild(buildBarGroup(label, stocks.length, maxCapCount, capColor[label],
      stocks.length
        ? stocks.map(s=>`<div class="sub-item">${marketTagHtml(s,true)}<span class="name-cell" onclick="openNaver('${s.code}')">${s.name}</span><span class="c">${fmtCap(s.marketCap)}</span></div>`).join('')
        : '<div class="sub-item">해당 종목 없음</div>'
    ));
  });

  // ---- 추천 순위: 상단 기간의 종료일을 기준으로 1/5/10/20영업일 누적 ----
  const anchor = anchorDate || latestDate;
  const windows = [1,3,5,10,20,50].map(n => ({ n, start: bizDaysStart(anchor, n) }));
  const byStockAll = {};
  DATA.picks.forEach(p => {
    if(p.date > anchor) return;
    if(!byStockAll[p.code]) byStockAll[p.code] = {
      name:p.name, code:p.code, market:p.market, inIndex:p.inIndex, sector:p.sector,
      marketCap:p.marketCap, price:p.price,
      counts:{w1:0,w3:0,w5:0,w10:0,w20:0,w50:0}
    };
    const rec = byStockAll[p.code];
    rec.marketCap = p.marketCap; rec.price = p.price;
    windows.forEach(w => { if(p.date >= w.start && p.date <= anchor) rec.counts['w'+w.n]++; });
  });
  rankedAll = Object.values(byStockAll).filter(s => s.counts.w50 > 0);

  renderTable();
}
</script>
