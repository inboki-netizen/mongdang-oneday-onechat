<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>줌과외 1기 종목추천 (모바일)</title>
<style>
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --panel-2:#F1F3F6; --line:#E3E6EB;
    --text:#1A1D21; --sub:#6B7280;
    --kospi:#D93025; --kospi200:#E07B1E; --kosdaq:#1A73E8; --kosdaq150:#0F9D78;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    font-size:14px; line-height:1.4; padding-bottom:40px;
  }
  #gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; z-index:100;}
  #gate input{background:var(--panel); border:1px solid var(--line); padding:12px; border-radius:8px; font-size:17px; width:220px; text-align:center;}
  #gate button{background:var(--kospi); color:#fff; border:none; padding:12px 22px; border-radius:8px; font-size:16px; font-weight:600; width:220px;}
  #gate .err{color:var(--kospi); font-size:14px; display:none;}

  #app{display:none;}
  .row{
    background:var(--panel); border-bottom:1px solid var(--line); padding:7px 14px;
    display:flex; align-items:center; gap:8px; white-space:nowrap; overflow-x:auto;
  }
  .row::-webkit-scrollbar{display:none;}
  .row .label{color:var(--sub); font-size:12px; flex-shrink:0; width:64px;}
  .row .value{font-weight:600; font-size:14px;}
  .row.title-row{flex-wrap:nowrap; padding:12px 14px;}
  .title-row .name{font-weight:700; font-size:15px;}
  .title-row .meta{color:var(--sub); font-size:11px;}

  .upd{color:var(--kospi); font-weight:700;}

  .period-block{background:var(--panel); border-bottom:1px solid var(--line); padding-bottom:10px;}
  .period-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 14px 0;}
  .qr-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--sub);
    padding:8px 4px; border-radius:8px; font-size:13px; font-weight:600; text-align:center;
  }
  .qr-btn.active{background:var(--kospi); color:#fff; border-color:var(--kospi);}

  .basis-tag{font-size:11px; font-weight:700; padding:1px 6px; border-radius:8px; margin-left:6px; background:rgba(26,115,232,0.12); color:var(--kosdaq);}

  /* 시장분포·시총분포는 5~7개, 추천순위는 10개 정도 보이는 높이로 스크롤 */
  .scroll-list{max-height:250px; overflow-y:auto;}
  .scroll-list-rank{max-height:532px; overflow-y:auto;}
  .scroll-list::-webkit-scrollbar, .scroll-list-rank::-webkit-scrollbar{width:5px;}
  .scroll-list::-webkit-scrollbar-thumb, .scroll-list-rank::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .tag{display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; flex-shrink:0;}
  .tag.kospi{background:rgba(217,48,37,0.1); color:var(--kospi);}
  .tag.kospi200{background:rgba(224,123,30,0.12); color:var(--kospi200);}
  .tag.kosdaq{background:rgba(26,115,232,0.1); color:var(--kosdaq);}
  .tag.kosdaq150{background:rgba(15,157,120,0.12); color:var(--kosdaq150);}

  .chip{
    flex-shrink:0; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:6px 10px; font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px;
    min-width:64px; cursor:pointer;
  }
  .chip .r{color:var(--sub); font-size:10px;}
  .chip .n{font-weight:700; font-size:12px; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis;}
  .chip .c{color:var(--kospi); font-weight:700; font-size:11px;}

  .dist-item{flex-shrink:0; font-size:12px; padding:4px 8px; background:var(--panel-2); border-radius:8px;}
  .dist-item b{font-variant-numeric:tabular-nums;}
  .section{background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px;}
  .section .header{color:var(--sub); font-size:12px; margin-bottom:5px;}
  .section .header #m-rank-basis{color:var(--sub); font-weight:400;}

  .top-item{display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:14px; border-bottom:1px solid var(--line);}
  .top-item:last-child{border-bottom:none;}
  .top-item .cnt{color:var(--kospi); font-weight:700;}

  .dist-line{display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .dist-line:last-child{border-bottom:none;}
  .dist-line .cnt{font-weight:700; font-variant-numeric:tabular-nums;}
  .dist-line.clickable{cursor:pointer;}
  .dist-sublist{display:none; padding:2px 0 6px 12px; border-bottom:1px solid var(--line);}
  .dist-sublist.show{display:block;}
  .sub-row{display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:12.5px; color:var(--sub); cursor:pointer; gap:6px;}
  .sub-row .cnt{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; text-align:center; min-width:56px; flex-shrink:0;}
  .sub-row > span:first-child:not(.tag){text-align:left; flex:1;}
  .sub-row .name-flex{text-align:left; flex:1;}

  .dist-item{flex-shrink:0; font-size:12px; padding:4px 8px; background:var(--panel-2); border-radius:8px;}
  .dist-item b{font-variant-numeric:tabular-nums;}

  .rank-card{
    border-bottom:1px solid var(--line); padding:5px 0; display:flex; flex-direction:column; gap:1px;
  }
  .rank-card:last-child{border-bottom:none;}
  .rank-card .top-line{display:flex; align-items:center; gap:6px;}
  .rank-card .rk{color:var(--sub); font-size:12px; width:26px; flex-shrink:0;}
  .rank-card .nm{font-weight:700; font-size:14px; flex:1; cursor:pointer;}
  .rank-card .seg{color:var(--sub); font-size:10px; font-weight:400;}
  .rank-card .cnt{color:var(--kospi); font-weight:700; font-size:13px; flex-shrink:0;}
  .rank-card .sub-line{display:flex; gap:8px; padding-left:32px; font-size:11px; color:var(--sub); flex-wrap:wrap;}
  .rank-card .sub-line b{color:var(--text); font-variant-numeric:tabular-nums;}

  a.top-link{display:block; text-align:center; padding:10px; font-size:12px; color:var(--sub); background:var(--panel);}
</style>
</head>
<body>

<div id="gate">
  <div style="font-weight:700; font-size:18px;">줌과외 1기 종목추천</div>
  <div style="color:var(--sub); font-size:13px;">비밀번호를 입력하세요</div>
  <input type="password" id="pw" placeholder="비밀번호">
  <button onclick="checkPw()">입장</button>
  <div class="err" id="err">비밀번호가 올바르지 않습니다</div>
</div>

<div id="app">
  <!-- 1줄: 제목 -->
  <div class="row title-row">
    <span class="name">줌과외 1기 종목추천</span>
  </div>
  <!-- 1줄: 업데이트(먼저, 강조색) + 기준(참고) -->
  <div class="row title-row">
    <span class="meta"><span class="upd">업데이트 <span id="m-updated"></span></span> · * 영업일 기준 : 전일 09시~09시</span>
  </div>

  <!-- 기간: 6개 버튼을 위 3개 / 아래 3개로 배치 -->
  <div class="period-block">
    <div class="label" style="padding:6px 14px 0;">기간</div>
    <div class="period-grid" id="m-period"></div>
  </div>

  <!-- 1줄: 총 추천건수 -->
  <div class="row"><span class="label">총 추천건수</span><span class="value" id="m-total"></span></div>
  <!-- 1줄: 종목수 -->
  <div class="row"><span class="label">종목수</span><span class="value" id="m-unique"></span></div>

  <!-- 최다 추천: 종목 1개당 1줄 -->
  <div class="section">
    <div class="header">최다 추천 <span id="m-top-basis"></span></div>
    <div id="m-top"></div>
  </div>

  <!-- 시장분포: 항목별 아래로 배열 -->
  <div class="section">
    <div class="header">시장분포 <span id="m-market-basis"></span></div>
    <div id="m-market" class="scroll-list"></div>
  </div>

  <!-- 시가총액 분포: 항목별 아래로 배열 -->
  <div class="section">
    <div class="header">시총분포 <span id="m-cap-basis"></span></div>
    <div id="m-cap" class="scroll-list"></div>
  </div>

  <!-- 추천순위: 종목 1개당 1줄(박스), 시총·PER·PBR 포함 -->
  <div class="section">
    <div class="header">추천순위 <span id="m-rank-basis"></span></div>

    <div id="m-rank" class="scroll-list-rank"></div>
  </div>

  <a class="top-link" href="index.html">PC용 전체 대시보드 보기 →</a>
</div>

const PASSWORD = "8888";

function isWeekend(d){ const day = d.getDay(); return day===0 || day===6; }
function toDateStr(d){ return d.toISOString().slice(0,10); }
function isNonTradingDay(d){ return isWeekend(d) || KRX_HOLIDAYS.has(toDateStr(d)); }
function bizDaysStart(endDateStr, n){
  let d = new Date(endDateStr);
  let count = 1;
  while(count < n){
    d.setDate(d.getDate()-1);
    if(!isNonTradingDay(d)) count++;
  }
  return toDateStr(d);
}

const UPDATED_AT = "2026-09-05 오후 6:06";
let latestDate = "";
let curStart = "", curEnd = "";

function checkPw(){
  const val = document.getElementById('pw').value;
  if(val === PASSWORD){
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('m-updated').textContent = UPDATED_AT;
    const dates = DATA.picks.map(p=>p.date).sort();
    latestDate = dates[dates.length-1];
    buildPeriodRow();
    setRange(5);
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') checkPw(); });

function buildPeriodRow(){
  const row = document.getElementById('m-period');
  [1,3,5,10,20,50].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn'; btn.textContent = n + '영업일'; btn.dataset.n = n;
    btn.onclick = () => setRange(n);
    row.appendChild(btn);
  });
}

function marketLabel(s){
  if(s.market === 'KOSPI') return s.inIndex ? '코스피200' : '코스피';
  return s.inIndex ? '코스닥150' : '코스닥';
}
function marketTagClass(s){
  if(s.market === 'KOSPI') return s.inIndex ? 'kospi200' : 'kospi';
  return s.inIndex ? 'kosdaq150' : 'kosdaq';
}
function openNaver(code){
  window.open('https://stock.naver.com/domestic/stock/'+code+'/total', 'naverStock', 'width=1000,height=800,noopener');
}

let curRangeLabel = '5영업일';
function setRange(n){
  document.querySelectorAll('.qr-btn').forEach(b => b.classList.toggle('active', +b.dataset.n === n));
  curStart = bizDaysStart(latestDate, n);
  curEnd = latestDate;
  curRangeLabel = n + '영업일';
  render();
}
function fmtCap(v){
  if(v >= 10000) return (v/10000).toFixed(1).replace(/\.0$/,'') + '조';
  return v.toLocaleString() + '억';
}

function render(){
  const picks = DATA.picks.filter(p => p.date >= curStart && p.date <= curEnd);
  const byStock = {};
  picks.forEach(p => {
    if(!byStock[p.code]) byStock[p.code] = { ...p, count:0 };
    byStock[p.code].count++;
    byStock[p.code].market = p.market; byStock[p.code].inIndex = p.inIndex;
  });
  const ranked = Object.values(byStock).sort((a,b)=>b.count-a.count);

  document.getElementById('m-total').textContent = picks.length + '건';
  document.getElementById('m-unique').textContent = ranked.length + '개';

  // 최다 추천: 동률이면 종목마다 한 줄씩
  const topCount = ranked.length ? ranked[0].count : 0;
  const topStocks = ranked.filter(s=>s.count===topCount);
  document.getElementById('m-top-basis').innerHTML = `<span class="basis-tag">${curRangeLabel} 기준</span>`;
  const topBox = document.getElementById('m-top');
  topBox.innerHTML = topStocks.length
    ? topStocks.map(s => {
        const pct = picks.length ? Math.round(s.count/picks.length*100) : 0;
        return `<div class="top-item"><span>${s.name}</span><span class="cnt">${s.count}회 · ${pct}%</span></div>`;
      }).join('')
    : '<div class="top-item">-</div>';

  // 시장분포: 항목별로 아래로 배열
  const groupDefs = [
    { label:'KOSPI200', cls:'kospi200', filter:s=>s.market==='KOSPI'&&s.inIndex },
    { label:'KOSPI',    cls:'kospi',    filter:s=>s.market==='KOSPI'&&!s.inIndex },
    { label:'KOSDAQ150',cls:'kosdaq150',filter:s=>s.market==='KOSDAQ'&&s.inIndex },
    { label:'KOSDAQ',   cls:'kosdaq',   filter:s=>s.market==='KOSDAQ'&&!s.inIndex },
  ];
  document.getElementById('m-market-basis').innerHTML = `<span class="basis-tag">${curRangeLabel} 기준</span>`;
  const marketBox = document.getElementById('m-market');
  marketBox.innerHTML = '';
  const marketCountsArr = groupDefs.map(g => ranked.filter(g.filter).length); // 종목수 기준(중복 제거)
  const maxMarketCnt = Math.max(...marketCountsArr, 1); // 시총분포와 동일하게 최대값 기준 비율(%)
  groupDefs.forEach((g, gi) => {
    const stocks = ranked.filter(g.filter);
    const cnt = marketCountsArr[gi];
    const pct = Math.round(cnt/maxMarketCnt*100);
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="dist-line clickable"><span class="tag ${g.cls}">${g.label}</span><span class="cnt">${cnt}개 · ${pct}%</span></div>`;
    const line = wrap.firstElementChild;
    const sub = document.createElement('div');
    sub.className = 'dist-sublist';
    sub.innerHTML = stocks.length
      ? stocks.map((s,i)=>`<div class="sub-row" onclick="openNaver('${s.code}')" title="${s.name}${s.seg?' ('+s.seg+')':''}"><span>${i+1}. ${s.name}${s.seg?`<span class=\"seg\">(${s.seg})</span>`:''}</span><span class="cnt">${s.count}회</span></div>`).join('')
      : '<div class="sub-row">해당 종목 없음</div>';
    line.addEventListener('click', () => sub.classList.toggle('show'));
    marketBox.appendChild(line);
    marketBox.appendChild(sub);
  });

  // 시가총액 분포: 항목별로 아래로 배열
  const capTiers = [
    { label:'10조 이상', min:100000 },
    { label:'10조~1조', min:10000 },
    { label:'1조~5000억', min:5000 },
    { label:'5000억 미만', min:-Infinity },
  ];
  document.getElementById('m-cap-basis').innerHTML = `<span class="basis-tag">${curRangeLabel} 기준</span>`;
  const capBox = document.getElementById('m-cap');
  const capGroups = capTiers.map(t => ranked.filter(s => {
    const tier = capTiers.find(tt => s.marketCap >= tt.min);
    return tier.label === t.label;
  }));
  const maxCapCnt = Math.max(...capGroups.map(g=>g.length), 1); // 데스크탑처럼 최대값을 100% 기준으로
  capBox.innerHTML = '';
  capTiers.forEach((t, i) => {
    const stocks = capGroups[i];
    const cnt = stocks.length;
    const pct = Math.round(cnt/maxCapCnt*100);
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="dist-line clickable"><span>${t.label}</span><span class="cnt">${cnt}개 · ${pct}%</span></div>`;
    const line = wrap.firstElementChild;
    const sub = document.createElement('div');
    sub.className = 'dist-sublist';
    sub.innerHTML = stocks.length
      ? stocks.map(s=>`<div class="sub-row" onclick="openNaver('${s.code}')" title="${s.name}${s.seg?' ('+s.seg+')':''}"><span class="tag ${marketTagClass(s)}" style="margin-right:6px; flex-shrink:0;">${marketLabel(s)}</span><span class="name-flex">${s.name}${s.seg?`<span class=\"seg\">(${s.seg})</span>`:''}</span><span class="cnt">${fmtCap(s.marketCap)}</span></div>`).join('')
      : '<div class="sub-row">해당 종목 없음</div>';
    line.addEventListener('click', () => sub.classList.toggle('show'));
    capBox.appendChild(line);
    capBox.appendChild(sub);
  });

  // 추천순위: 종목 1개당 1줄(박스) + 시총·PER·PBR
  document.getElementById('m-rank-basis').innerHTML = `<span class="basis-tag">${curRangeLabel} 기준</span>`;
  const rankBox = document.getElementById('m-rank');
  rankBox.innerHTML = ranked.map((s,i) => `
    <div class="rank-card">
      <div class="top-line">
        <span class="rk">${i+1}위</span>
        <span class="tag ${marketTagClass(s)}" style="flex-shrink:0;">${marketLabel(s)}</span>
        <span class="nm" onclick="openNaver('${s.code}')" title="${s.name}${s.seg?' ('+s.seg+')':''}">${s.name}${s.seg ? `<span class="seg">(${s.seg})</span>` : ''}</span>
        <span class="cnt">${s.count}회</span>
      </div>
      <div class="sub-line">
        <span>시총 <b>${fmtCap(s.marketCap)}</b></span>
        <span>PER <b>${s.per != null ? s.per.toFixed(1) : '-'}</b></span>
        <span>PBR <b>${s.pbr != null ? s.pbr.toFixed(1) : '-'}</b></span>
        <span>배당 <b>${s.div != null ? s.div.toFixed(2)+'%' : '-'}</b></span>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
